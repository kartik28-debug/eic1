<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/eic-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password — EIC IIIT Una</title>
    <meta name="description" content="Set your new password for EIC IIIT Una Game Hub." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-dark:       #050811;
        --bg-card:       rgba(8, 16, 30, 0.65);
        --cyan:          #00e5ff;
        --teal:          #00bcd4;
        --gold:          #e0c253;
        --gold-glow:     rgba(224, 194, 83, 0.25);
        --cyan-glow:     rgba(0, 229, 255, 0.2);
        --text-main:     #e8f4f8;
        --text-muted:    #8aa2b8;
        --border-line:   rgba(0, 229, 255, 0.18);
        --font-display:  'Space Grotesk', system-ui, sans-serif;
        --font-body:     'Inter', system-ui, sans-serif;
        --font-mono:     'JetBrains Mono', monospace;
      }

      html { color-scheme: dark; }

      body {
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* ── Animated Background ── */
      .cp-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .cp-bg::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: 
          radial-gradient(ellipse 600px 400px at 30% 40%, rgba(224,194,83,0.06) 0%, transparent 70%),
          radial-gradient(ellipse 500px 500px at 70% 60%, rgba(0,229,255,0.05) 0%, transparent 70%);
        animation: cpDrift 18s ease-in-out infinite alternate;
      }

      @keyframes cpDrift {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(-2%, 3%) rotate(1.5deg); }
      }

      .grid-lines {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(224,194,83,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(224,194,83,0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        opacity: 0.5;
      }

      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: var(--gold);
        border-radius: 50%;
        opacity: 0;
        animation: floatP 8s ease-in-out infinite;
      }

      .particle:nth-child(1) { left: 15%; top: 25%; animation-delay: 0s; }
      .particle:nth-child(2) { left: 35%; top: 65%; animation-delay: 2s; }
      .particle:nth-child(3) { left: 55%; top: 15%; animation-delay: 1s; animation-duration: 10s; }
      .particle:nth-child(4) { left: 75%; top: 50%; animation-delay: 3s; }
      .particle:nth-child(5) { left: 90%; top: 80%; animation-delay: 4.5s; animation-duration: 7s; }
      .particle:nth-child(6) { left: 45%; top: 40%; animation-delay: 0.5s; animation-duration: 11s; }

      @keyframes floatP {
        0%, 100% { opacity: 0; transform: translateY(0) scale(1); }
        20% { opacity: 0.5; }
        50% { opacity: 0.7; transform: translateY(-50px) scale(1.6); }
        80% { opacity: 0.2; }
      }

      /* ── Card ── */
      .cp-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 460px;
        padding: 0 24px;
        animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        opacity: 0;
        transform: translateY(30px);
      }

      @keyframes cardIn {
        to { opacity: 1; transform: translateY(0); }
      }

      .cp-card {
        background: rgba(8, 16, 32, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(224,194,83,0.18);
        border-radius: 20px;
        padding: 48px 40px 40px;
        position: relative;
        overflow: hidden;
      }

      .cp-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold), var(--cyan), var(--gold), transparent);
        animation: glowLine 3s ease-in-out infinite;
      }

      @keyframes glowLine {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .cp-brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .cp-brand .lock-icon {
        width: 52px;
        height: 52px;
        background: rgba(224,194,83,0.1);
        border: 1px solid rgba(224,194,83,0.25);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin: 0 auto 16px;
        animation: lockPulse 3s ease-in-out infinite;
      }

      @keyframes lockPulse {
        0%, 100% { box-shadow: 0 0 8px var(--gold-glow); }
        50% { box-shadow: 0 0 24px var(--gold-glow); }
      }

      .cp-brand h1 {
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 2.5px;
        margin-bottom: 6px;
      }

      .cp-brand h1 .accent { color: var(--gold); }

      .cp-brand p {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--text-muted);
        letter-spacing: 1.5px;
      }

      .cp-notice {
        background: rgba(224,194,83,0.06);
        border: 1px solid rgba(224,194,83,0.15);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.78rem;
        color: var(--gold);
        text-align: center;
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .cp-tag {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--gold);
        letter-spacing: 2px;
        margin-bottom: 20px;
        opacity: 0.7;
        text-align: center;
        width: 100%;
      }

      .cp-form { display: flex; flex-direction: column; gap: 20px; }

      .input-group { position: relative; }

      .input-label {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .input-field {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(224,194,83,0.12);
        border-radius: 12px;
        color: var(--text-main);
        font-family: var(--font-mono);
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        outline: none;
        transition: all 0.3s ease;
      }

      .input-field::placeholder {
        color: rgba(138, 162, 184, 0.5);
        font-family: var(--font-body);
        font-size: 0.82rem;
      }

      .input-field:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(224,194,83,0.08), 0 0 20px rgba(224,194,83,0.06);
        background: rgba(0, 0, 0, 0.5);
      }

      .cp-btn {
        width: 100%;
        padding: 16px;
        margin-top: 8px;
        background: linear-gradient(135deg, rgba(224,194,83,0.15), rgba(224,194,83,0.08));
        border: 1px solid var(--gold);
        border-radius: 12px;
        color: var(--gold);
        font-family: var(--font-display);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.35s ease;
      }

      .cp-btn:hover {
        background: linear-gradient(135deg, var(--gold), #c9a93c);
        color: #050811;
        box-shadow: 0 0 30px rgba(224,194,83,0.3), 0 8px 32px rgba(224,194,83,0.15);
        transform: translateY(-2px);
      }

      .cp-btn:active { transform: translateY(0); }
      .cp-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      .cp-btn .btn-text { position: relative; z-index: 1; }

      .error-msg {
        background: rgba(255, 59, 48, 0.08);
        border: 1px solid rgba(255, 59, 48, 0.25);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.8rem;
        color: #ff6b6b;
        text-align: center;
        display: none;
        animation: shakeIn 0.4s ease;
      }

      .error-msg.visible { display: block; }

      .success-msg {
        background: rgba(0, 229, 255, 0.06);
        border: 1px solid rgba(0, 229, 255, 0.2);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.8rem;
        color: var(--cyan);
        text-align: center;
        display: none;
        animation: cardIn 0.5s ease;
      }

      .success-msg.visible { display: block; }

      @keyframes shakeIn {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }

      .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(224,194,83,0.2);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin: 0 auto;
      }

      .spinner.active { display: inline-block; }

      @keyframes spin { to { transform: rotate(360deg); } }

      .student-info {
        text-align: center;
        margin-bottom: 8px;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--text-muted);
        letter-spacing: 1px;
      }

      .student-info strong {
        color: var(--text-main);
      }

      @media (max-width: 520px) {
        .cp-card { padding: 36px 24px 32px; }
        .cp-brand h1 { font-size: 1.15rem; }
      }
    </style>
  </head>
  <body>

    <!-- Background -->
    <div class="cp-bg">
      <div class="grid-lines"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Card -->
    <div class="cp-wrapper">
      <div class="cp-card">

        <div class="cp-brand">
          <div class="lock-icon">🔐</div>
          <h1>SET <span class="accent">NEW PASSWORD</span></h1>
          <p>FIRST LOGIN — SECURITY REQUIRED</p>
        </div>

        <div class="student-info" id="student-info"></div>

        <div class="cp-notice">
          Welcome! This is your first login. Please set a new personal password to continue.
        </div>

        <span class="cp-tag">[ PASSWORD SETUP ]</span>

        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>

        <form class="cp-form" id="cp-form" autocomplete="off">
          <div class="input-group">
            <label class="input-label" for="new-password">New Password</label>
            <input
              type="password"
              class="input-field"
              id="new-password"
              name="newPassword"
              placeholder="Minimum 6 characters"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>

          <div class="input-group">
            <label class="input-label" for="confirm-password">Confirm Password</label>
            <input
              type="password"
              class="input-field"
              id="confirm-password"
              name="confirmPassword"
              placeholder="Re-enter your new password"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>

          <button type="submit" class="cp-btn" id="cp-btn">
            <span class="btn-text" id="btn-text">SET PASSWORD →</span>
            <span class="spinner" id="spinner"></span>
          </button>
        </form>

      </div>
    </div>

    <script>
      const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '5173' ? 'http://localhost:5000' : '';

      const form = document.getElementById('cp-form');
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const cpBtn = document.getElementById('cp-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('spinner');
      const studentInfo = document.getElementById('student-info');

      function showError(msg) {
        successMsg.classList.remove('visible');
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function showSuccess(msg) {
        errorMsg.classList.remove('visible');
        successMsg.textContent = msg;
        successMsg.classList.add('visible');
      }

      function setLoading(loading) {
        cpBtn.disabled = loading;
        btnText.style.display = loading ? 'none' : 'inline';
        spinner.classList.toggle('active', loading);
      }

      // Verify user is authenticated and needs password change
      (async () => {
        try {
          const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
          const data = await res.json();

          if (!data.authenticated) {
            window.location.href = 'login.html';
            return;
          }

          if (!data.mustChangePassword) {
            // Already changed password, go to games
            window.location.href = 'games.html';
            return;
          }

          // Show student info
          studentInfo.innerHTML = `Logged in as: <strong>${data.student.name}</strong> (${data.student.rollNumber})`;

        } catch (e) {
          window.location.href = 'login.html';
        }
      })();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.classList.remove('visible');
        successMsg.classList.remove('visible');

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (!newPassword || !confirmPassword) {
          showError('Please fill both fields.');
          return;
        }

        if (newPassword.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        if (newPassword !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        setLoading(true);

        try {
          const res = await fetch(`${API_BASE}/api/auth/change-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ newPassword, confirmPassword })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            showError(data.message || 'Failed to change password.');
            setLoading(false);
            return;
          }

          showSuccess('Password set successfully! Redirecting to Game Hub...');
          form.style.opacity = '0.4';
          form.style.pointerEvents = 'none';

          setTimeout(() => {
            window.location.href = 'games.html';
          }, 1500);

        } catch (err) {
          console.error('Change password error:', err);
          showError('Unable to reach server. Please try again.');
          setLoading(false);
        }
      });
    </script>

  </body>
</html>
