<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/eic-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — EIC IIIT Una</title>
    <meta name="description" content="Student login portal for EIC IIIT Una Game Hub." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-dark:       #050811;
        --bg-card:       rgba(8, 16, 30, 0.65);
        --cyan:          #00e5ff;
        --teal:          #00bcd4;
        --gold:          #e0c253;
        --gold-glow:     rgba(224, 194, 83, 0.25);
        --cyan-glow:     rgba(0, 229, 255, 0.2);
        --text-main:     #e8f4f8;
        --text-muted:    #8aa2b8;
        --border-line:   rgba(0, 229, 255, 0.18);
        --font-display:  'Space Grotesk', system-ui, sans-serif;
        --font-body:     'Inter', system-ui, sans-serif;
        --font-mono:     'JetBrains Mono', monospace;
      }

      html { color-scheme: dark; }

      body {
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* ── Animated Background ── */
      .login-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .login-bg::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: 
          radial-gradient(ellipse 600px 400px at 20% 30%, rgba(0,229,255,0.06) 0%, transparent 70%),
          radial-gradient(ellipse 500px 500px at 80% 70%, rgba(224,194,83,0.04) 0%, transparent 70%),
          radial-gradient(ellipse 400px 300px at 50% 50%, rgba(0,188,212,0.03) 0%, transparent 60%);
        animation: bgDrift 20s ease-in-out infinite alternate;
      }

      @keyframes bgDrift {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(-3%, 2%) rotate(2deg); }
      }

      /* Grid Lines */
      .grid-lines {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        opacity: 0.6;
      }

      /* Floating particles */
      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: var(--cyan);
        border-radius: 50%;
        opacity: 0;
        animation: floatParticle 8s ease-in-out infinite;
      }

      .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; animation-duration: 9s; }
      .particle:nth-child(2) { left: 25%; top: 60%; animation-delay: 1.5s; animation-duration: 7s; }
      .particle:nth-child(3) { left: 50%; top: 80%; animation-delay: 3s; animation-duration: 11s; }
      .particle:nth-child(4) { left: 70%; top: 15%; animation-delay: 2s; animation-duration: 8s; }
      .particle:nth-child(5) { left: 85%; top: 45%; animation-delay: 4s; animation-duration: 10s; }
      .particle:nth-child(6) { left: 40%; top: 35%; animation-delay: 0.5s; animation-duration: 12s; }
      .particle:nth-child(7) { left: 60%; top: 70%; animation-delay: 5s; animation-duration: 6s; }
      .particle:nth-child(8) { left: 15%; top: 85%; animation-delay: 3.5s; animation-duration: 9s; }

      @keyframes floatParticle {
        0%, 100% { opacity: 0; transform: translateY(0) scale(1); }
        20% { opacity: 0.6; }
        50% { opacity: 0.8; transform: translateY(-60px) scale(1.8); }
        80% { opacity: 0.3; }
      }

      /* ── Login Card ── */
      .login-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 460px;
        padding: 0 24px;
        animation: cardEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        opacity: 0;
        transform: translateY(30px);
      }

      @keyframes cardEnter {
        to { opacity: 1; transform: translateY(0); }
      }

      .login-card {
        background: rgba(8, 16, 32, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border-line);
        border-radius: 20px;
        padding: 48px 40px 40px;
        position: relative;
        overflow: hidden;
      }

      .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), var(--cyan), transparent);
        animation: topGlow 3s ease-in-out infinite;
      }

      @keyframes topGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      /* Brand Header */
      .login-brand {
        text-align: center;
        margin-bottom: 36px;
      }

      .login-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        margin-bottom: 16px;
        filter: drop-shadow(0 0 12px var(--cyan-glow));
        animation: logoPulse 3s ease-in-out infinite;
      }

      @keyframes logoPulse {
        0%, 100% { filter: drop-shadow(0 0 8px var(--cyan-glow)); }
        50% { filter: drop-shadow(0 0 20px var(--cyan-glow)); }
      }

      .login-brand h1 {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 3px;
        color: var(--text-main);
        margin-bottom: 4px;
      }

      .login-brand .brand-accent {
        color: var(--cyan);
      }

      .login-brand p {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Tag */
      .login-tag {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--cyan);
        letter-spacing: 2px;
        margin-bottom: 24px;
        opacity: 0.7;
        text-align: center;
        width: 100%;
      }

      /* Form */
      .login-form { display: flex; flex-direction: column; gap: 20px; }

      .input-group {
        position: relative;
      }

      .input-label {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .input-field {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(0, 229, 255, 0.12);
        border-radius: 12px;
        color: var(--text-main);
        font-family: var(--font-mono);
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        outline: none;
        transition: all 0.3s ease;
      }

      .input-field::placeholder {
        color: rgba(138, 162, 184, 0.5);
        font-family: var(--font-body);
        font-size: 0.82rem;
      }

      .input-field:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.08), 0 0 20px rgba(0, 229, 255, 0.06);
        background: rgba(0, 0, 0, 0.5);
      }

      .input-field.error {
        border-color: #ff3b30;
        box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.08);
      }

      /* Submit Button */
      .login-btn {
        width: 100%;
        padding: 16px;
        margin-top: 8px;
        background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,188,212,0.1));
        border: 1px solid var(--cyan);
        border-radius: 12px;
        color: var(--cyan);
        font-family: var(--font-display);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.35s ease;
        position: relative;
        overflow: hidden;
      }

      .login-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--cyan), var(--teal));
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      .login-btn:hover {
        background: linear-gradient(135deg, var(--cyan), var(--teal));
        color: #050811;
        box-shadow: 0 0 30px rgba(0,229,255,0.3), 0 8px 32px rgba(0,229,255,0.15);
        transform: translateY(-2px);
      }

      .login-btn:active {
        transform: translateY(0);
      }

      .login-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .login-btn .btn-text { position: relative; z-index: 1; }

      /* Error Message */
      .error-msg {
        background: rgba(255, 59, 48, 0.08);
        border: 1px solid rgba(255, 59, 48, 0.25);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.8rem;
        color: #ff6b6b;
        text-align: center;
        display: none;
        animation: shakeIn 0.4s ease;
      }

      .error-msg.visible {
        display: block;
      }

      @keyframes shakeIn {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }

      /* Back Link */
      .back-link {
        display: block;
        text-align: center;
        margin-top: 24px;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--text-muted);
        text-decoration: none;
        letter-spacing: 1.5px;
        transition: color 0.3s ease;
      }

      .back-link:hover {
        color: var(--cyan);
      }

      /* Loading Spinner */
      .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(0,229,255,0.2);
        border-top-color: var(--cyan);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin: 0 auto;
      }

      .spinner.active { display: inline-block; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Responsive */
      @media (max-width: 520px) {
        .login-card { padding: 36px 24px 32px; }
        .login-brand h1 { font-size: 1.3rem; }
      }
    </style>
  </head>
  <body>

    <!-- Animated Background -->
    <div class="login-bg">
      <div class="grid-lines"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Login Card -->
    <div class="login-wrapper">
      <div class="login-card">

        <div class="login-brand">
          <img src="/eic-logo.png" alt="EIC Logo" class="login-logo" />
          <h1>EIC <span class="brand-accent">GAME HUB</span></h1>
          <p>IIIT Una Entrepreneurship &amp; Innovation Club</p>
        </div>

        <span class="login-tag">[ STUDENT AUTHENTICATION ]</span>

        <div class="error-msg" id="error-msg"></div>

        <form class="login-form" id="login-form" autocomplete="off">
          <div class="input-group">
            <label class="input-label" for="roll-number">Roll Number</label>
            <input
              type="text"
              class="input-field"
              id="roll-number"
              name="roll_number"
              placeholder="Enter your roll number"
              required
              autocomplete="username"
            />
          </div>

          <div class="input-group">
            <label class="input-label" for="password">Password</label>
            <input
              type="password"
              class="input-field"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="login-btn" id="login-btn">
            <span class="btn-text" id="btn-text">AUTHENTICATE →</span>
            <span class="spinner" id="spinner"></span>
          </button>
        </form>

        <a href="index.html" class="back-link">← BACK TO EIC</a>

      </div>
    </div>

    <script>
      const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '5173' ? 'http://localhost:5000' : '';

      const form = document.getElementById('login-form');
      const errorMsg = document.getElementById('error-msg');
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('spinner');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function hideError() {
        errorMsg.classList.remove('visible');
      }

      function setLoading(loading) {
        loginBtn.disabled = loading;
        btnText.style.display = loading ? 'none' : 'inline';
        spinner.classList.toggle('active', loading);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const roll_number = document.getElementById('roll-number').value.trim();
        const password = document.getElementById('password').value;

        if (!roll_number || !password) {
          showError('Please enter both roll number and password.');
          return;
        }

        setLoading(true);

        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ roll_number, password })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            showError(data.message || 'Authentication failed.');
            setLoading(false);
            return;
          }

          // Check if password change is required
          if (data.mustChangePassword) {
            window.location.href = 'change-password.html';
          } else {
            window.location.href = 'games.html';
          }

        } catch (err) {
          console.error('Login error:', err);
          showError('Unable to reach server. Please try again.');
          setLoading(false);
        }
      });

      // Check if already authenticated
      (async () => {
        try {
          const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
          const data = await res.json();
          if (data.authenticated) {
            if (data.mustChangePassword) {
              window.location.href = 'change-password.html';
            } else {
              window.location.href = 'games.html';
            }
          }
        } catch (e) { /* not authenticated, stay on login */ }
      })();
    </script>

  </body>
</html>
